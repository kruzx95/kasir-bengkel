# ============================================
# Nginx Configuration — Irian Motor
# ============================================
# Lokasi file: /etc/nginx/sites-available/irian-motor
# Ganti DOMAIN_ANDA dengan domain asli Anda
# ============================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA www.DOMAIN_ANDA;

    # Certbot ACME challenge (jangan hapus)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_ANDA www.DOMAIN_ANDA;

    # SSL Certificate (akan diisi oleh Certbot)
    ssl_certificate /etc/letsencrypt/live/DOMAIN_ANDA/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_ANDA/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upload file limit (sesuai kebutuhan upload nota)
    client_max_body_size 10M;

    # Static files caching (Next.js _next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon & public assets
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        access_log off;
    }

    # Proxy ke Next.js (PM2)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
