# ============================================
# Nginx Configuration — Irian Motor (Production & Staging)
# ============================================
# Lokasi file: /etc/nginx/sites-available/irian-motor.conf
# Ganti DOMAIN_ANDA dengan domain asli Anda (misal: irianmotor.com)
# ============================================

# ============================================
# 1. PRODUCTION (domainanda.com & www.domainanda.com -> Port 3000)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA www.DOMAIN_ANDA;

    client_max_body_size 20M;

    # Static files caching (Next.js _next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon & public assets
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        access_log off;
    }

    # Proxy ke Next.js Production (PM2)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================
# 2. STAGING (staging.domainanda.com -> Port 3001)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.DOMAIN_ANDA;

    client_max_body_size 20M;

    # Static files caching (Next.js _next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon & public assets
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3001;
        expires 30d;
        access_log off;
    }

    # Proxy ke Next.js Staging (PM2)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

